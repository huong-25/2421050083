<!-- 
 <h1> → <h6>	Tiêu đề từ lớn đến nhỏ
<p>	Đoạn văn bản
<br>	:Xuống dòng
<hr>	:Kẻ đường ngang
<b> / <strong>:	In đậm
<i> / <em>	:In nghiêng
<u> :Gạch chân
<span>	:Khối văn bản nội dòng (inline)
<ul>	:Danh sách không thứ tự (dấu chấm)
<ol>	:Danh sách có thứ tự (số)
<li>	:Mỗi mục trong danh sách
<a>	Liên kết (hyperlink)
<img>	Chèn hình ảnh
<audio>	Chèn file âm thanh
<video>	Chèn video
<source>	Nguồn file cho audio/video
<table>	Tạo bảng
<tr>	Một hàng (table row)
<td>	Một ô dữ liệu (table data)
<th>	Ô tiêu đề (table header)
<form>	Tạo biểu mẫu
<input>	Ô nhập liệu
<div>	Khối chứa nội dung (không mang ý nghĩa ngữ nghĩa)
<header>	Phần đầu trang/khối
<footer>	Phần chân trang/khối
<nav>	Thanh điều hướng (menu)
<main>	Nội dung chính của trang
color	Màu chữ
background-color	Màu nền
background-image	Ảnh nền
background-repeat	Lặp lại ảnh nền
background-position	Vị trí ảnh nền
background-size	Kích thước ảnh nền
background-attachment	Ảnh nền cố định/cuộn theo trang
font-size	Cỡ chữ
font-weight	Độ đậm chữ
font-style	In nghiêng (italic)
text-align	Căn lề văn bản (trái/phải/giữa)
width	Chiều rộng
height	Chiều cao
max-width / min-width	Chiều rộng tối đa/tối thiểu
max-height / min-height	Chiều cao tối đa/tối thiểu
margin	Khoảng cách bên ngoài phần tử
padding	Khoảng cách bên trong (giữa nội dung và viền)
box-sizing	Cách tính kích thước phần tử
border	Viền (gộp chung width, style, color)
border-width	Độ dày viền
border-style	Kiểu viền (solid, dashed, dotted...)
border-color	Màu viền
border-radius	Bo góc
justify-content	Căn theo trục chính
separate → mỗi ô có viền riêng.
collapse → viền các ô được gộp lại thành một đường.
Quy định khoảng cách giữa các ô khi border-collapse: separate.
border-right: 1px solid #ddd;

Có nghĩa là:

border-right → tạo viền bên phải của ô.
1px → độ dày viền 1 pixel.
solid → đường viền liền nét.
#ddd → màu xám nhạt.
    -->
